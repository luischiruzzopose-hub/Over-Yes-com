<style>[hidden]{display:none!important}body{margin:0}</style>
<style>
/* Layout: editorial fashion campaign — full-bleed photography, giant expanded grotesk headlines, quiet mono metadata, everything else steps back. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#0b0b0a; --bg2:#111110; --surface:#171715; --surface2:#1f1e1c;
  --line:rgba(236,232,224,.12); --line2:rgba(236,232,224,.22);
  --fg:#ece8e0; --muted:#8f8b83; --dim:#5f5c56;
  --bone:#d9cfbd; --ink:#0b0b0a;
  --danger:#e0675c; --wa:#25d366;
  --f-display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-serif:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --gl:max(clamp(16px,4vw,56px),env(safe-area-inset-left,0px));
  --gr:max(clamp(16px,4vw,56px),env(safe-area-inset-right,0px));
  --nav-h:64px;
  --ease:cubic-bezier(.2,.7,.1,1);
  --ease-io:cubic-bezier(.65,0,.25,1);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--bg)}
img{display:block;max-width:100%}
h1,h2,h3,h4,p{margin:0}
figure{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--bone);outline-offset:3px}
::selection{background:var(--bone);color:var(--ink)}
.wrap{padding-left:var(--gl);padding-right:var(--gr)}
.lbl{font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.display{font-family:var(--f-display);font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:.9;text-wrap:balance}
.serif{font-family:var(--f-serif);font-style:italic;font-weight:400}
.star{display:inline-block;width:1em;height:1em;vertical-align:-.12em}

/* buttons */
.btn{--h:52px;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:var(--h);padding:0 28px;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--fg);background:var(--fg);color:var(--ink);position:relative;overflow:hidden;transition:color .35s var(--ease),background .35s var(--ease),border-color .35s,transform .2s;white-space:nowrap;isolation:isolate}
.btn::after{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .45s var(--ease);z-index:-1}
.btn:hover::after{transform:none}
.btn:hover{color:var(--fg)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line2)}
.btn.ghost::after{background:var(--fg)}
.btn.ghost:hover{color:var(--ink);border-color:var(--fg)}
.btn.wa{background:transparent;color:var(--fg);border-color:var(--line2)}
.btn.wa::after{background:var(--wa)}
.btn.wa:hover{color:#05170c;border-color:var(--wa)}
.btn.block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.btn svg{width:16px;height:16px;flex:none}
.link-u{position:relative;display:inline-block}
.link-u::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
.link-u:hover::after,.link-u.on::after{transform:scaleX(1);transform-origin:left}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;position:relative}
.icon-btn svg{width:20px;height:20px}

/* loader */
#loader{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:transform .8s var(--ease-io)}
#loader.out{transform:translateY(-100%)}
#loader .lw{display:flex;overflow:hidden;font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(36px,8vw,84px);letter-spacing:-.02em}
#loader .lw span{display:block;transform:translateY(105%);animation:lup .6s var(--ease) forwards}
#loader .bar{position:absolute;left:50%;bottom:22%;width:120px;height:1px;background:var(--line);transform:translateX(-50%);overflow:hidden}
#loader .bar i{position:absolute;inset:0;background:var(--fg);transform:scaleX(0);transform-origin:left;animation:lbar .9s var(--ease) forwards}
@keyframes lup{to{transform:none}}
@keyframes lbar{to{transform:scaleX(1)}}

/* nav */
.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:60;height:var(--nav-h);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-left:var(--gl);padding-right:var(--gr);transition:background .45s var(--ease),backdrop-filter .45s,border-color .45s,transform .45s var(--ease);border-bottom:1px solid transparent}
.nav.solid{background:rgba(11,11,10,.72);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-color:var(--line)}
.nav-links{display:flex;gap:26px}
.nav-links a{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.86;transition:opacity .2s}
.nav-links a:hover,.nav-links a.on{opacity:1}
.logo{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-stretch:100%;font-size:21px;letter-spacing:-.035em;line-height:1}
.logo .star{width:14px;height:14px;color:var(--bone);transition:transform .8s var(--ease)}
.logo:hover .star{transform:rotate(90deg)}
.nav-right{display:flex;justify-content:flex-end;align-items:center;gap:22px}
.nav-right .txt{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.cart-count{font-family:var(--f-mono);font-size:11px;display:inline-block;min-width:1.2em}
.cart-count.bump{animation:bump .5s var(--ease)}
@keyframes bump{30%{transform:translateY(-5px) scale(1.25)}}
.nav .m-only{display:none}
#menuBtn path{transform-box:fill-box;transform-origin:center;transition:transform .45s var(--ease)}
#menuBtn[aria-expanded="true"] .mb1{transform:translateY(3px) rotate(45deg)}
#menuBtn[aria-expanded="true"] .mb2{transform:translateY(-3px) rotate(-45deg)}
.nav-ico{display:none}
@media (max-width:1100px){
  .nav{grid-template-columns:auto 1fr auto}
  .nav-links,.nav-right .txt{display:none}
  .nav .m-only,.nav-ico{display:inline-grid}
  .nav-right{gap:2px;margin-right:-10px}
  .logo{grid-column:1}
  .nav-center{display:none}
}
.cart-badge{position:absolute;top:6px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--fg);color:var(--ink);font-family:var(--f-mono);font-size:10px;line-height:16px;text-align:center}
.cart-badge:empty,.cart-badge[data-n="0"]{display:none}

/* overlays */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:80;width:min(460px,100%);background:var(--bg2);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .55s var(--ease-io);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.left{right:auto;left:0;border-left:0;border-right:1px solid var(--line);transform:translateX(-100%);padding-right:0;padding-left:env(safe-area-inset-left,0px)}
.drawer.on{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;height:var(--nav-h);padding:0 20px 0 24px;border-bottom:1px solid var(--line);flex:none}
.dr-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 24px}
.dr-foot{flex:none;border-top:1px solid var(--line);padding:18px 24px 22px;display:grid;gap:10px}
.row-between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

/* menu (mobile) */
#menu{position:fixed;inset:0;z-index:58;background:var(--bg);display:flex;flex-direction:column;padding:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 12px) var(--gr) calc(28px + env(safe-area-inset-bottom,0px)) var(--gl);clip-path:inset(0 0 100% 0);transition:clip-path .6s var(--ease-io);visibility:hidden}
#menu.on{clip-path:inset(0);visibility:visible}
#menu nav{display:flex;flex-direction:column;gap:4px;margin-top:8px}
#menu nav a{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(30px,9vw,54px);line-height:1.05;letter-spacing:-.02em;text-transform:uppercase;transform:translateY(20px);opacity:0;transition:transform .6s var(--ease),opacity .6s}
#menu.on nav a{transform:none;opacity:1}
#menu .m-foot{margin-top:auto;display:grid;gap:14px}
#menu .m-foot a{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}

/* search */
#search{position:fixed;top:0;left:0;right:0;z-index:80;background:var(--bg2);border-bottom:1px solid var(--line);transform:translateY(-100%);transition:transform .55s var(--ease-io);padding:calc(env(safe-area-inset-top,0px) + 14px) var(--gr) 28px var(--gl);max-height:100svh;overflow-y:auto}
#search.on{transform:none}
.s-top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line2);padding-bottom:10px}
.s-top input{flex:1;min-width:0;background:none;border:0;outline:0;font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:clamp(24px,4.6vw,48px);letter-spacing:-.02em;text-transform:uppercase;padding:6px 0}
.s-top input::placeholder{color:var(--dim)}
.s-sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{height:34px;padding:0 14px;border:1px solid var(--line2);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;transition:background .25s,color .25s,border-color .25s}
.chip:hover{border-color:var(--fg)}
.chip.on{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.chip .sw{width:12px;height:12px;border-radius:50%;border:1px solid var(--line2)}
.s-res{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-top:22px}
.s-res a{display:grid;gap:8px}
.s-res .ph{aspect-ratio:4/5;background:var(--surface);overflow:hidden}
.s-res img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.s-res a:hover img{transform:scale(1.04)}
.s-res .nm{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1.3}
.s-meta{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px;flex-wrap:wrap}
@media (max-width:900px){.s-res{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* main + transitions */
#app{min-height:70vh;transition:opacity .22s ease,transform .22s ease}
#app.leave{opacity:0;transform:translateY(6px)}
.page{padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px))}
[data-rv]{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
[data-rv].in{opacity:1;transform:none}
.reveal-img{clip-path:inset(0 0 100% 0);transition:clip-path 1.2s var(--ease-io)}
.rv-proxy{position:absolute;width:1px;height:1px;pointer-events:none}
.reveal-img.in{clip-path:inset(0)}

/* hero */
.fit{width:max-content;max-width:none}
.hero{position:relative;height:100vh;height:max(560px,100svh);min-height:560px;overflow:hidden;background:#000}
.hero-frames{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.hf{position:relative;overflow:hidden;clip-path:inset(100% 0 0 0);transition:clip-path 1.3s var(--ease-io)}
.hero.go .hf{clip-path:inset(0)}
.hero.go .hf:nth-child(2){transition-delay:.12s}
.hero.go .hf:nth-child(3){transition-delay:.24s}
.hf img{position:absolute;inset:-4% 0;width:100%;height:108%;object-fit:cover;transform:scale(1.14);transition:transform 2.4s var(--ease);will-change:transform}
.hero.go .hf img{transform:scale(1.02)}
.hero.go .hf .drift{animation:drift 18s ease-in-out 2.4s infinite alternate}
@keyframes drift{to{transform:scale(1.07) translateY(-1.5%)}}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,10,.55) 0%,rgba(11,11,10,0) 22%,rgba(11,11,10,0) 45%,rgba(11,11,10,.7) 78%,var(--bg) 100%)}
.hero-copy{position:absolute;left:0;right:0;bottom:0;padding:0 var(--gr) clamp(64px,9vh,104px) var(--gl);display:flex;flex-direction:column;gap:18px}
.hero-copy > *{flex:none}
.hero-word{font-family:var(--f-display);font-stretch:125%;font-weight:800;line-height:.78;letter-spacing:-.035em;white-space:nowrap;color:var(--fg);display:flex;overflow:hidden;padding-top:.04em;margin-left:-.04em}
.hero-word span{display:block;transform:translateY(105%);transition:transform 1.1s var(--ease)}
.hero.go .hero-word span{transform:none}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;opacity:0;transform:translateY(16px);transition:opacity 1s var(--ease) .9s,transform 1s var(--ease) .9s}
.hero.go .hero-row{opacity:1;transform:none}
.hero-tag{display:grid;gap:6px}
.hero-tag .serif{font-size:clamp(22px,2.4vw,34px);line-height:1.05}
.scroll-ind{position:absolute;right:var(--gr);top:50%;display:flex;flex-direction:column;align-items:center;gap:12px;writing-mode:vertical-rl;font-family:var(--f-mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--fg);opacity:.8}
.scroll-ind i{display:block;width:1px;height:56px;background:var(--line2);position:relative;overflow:hidden}
.scroll-ind i::after{content:"";position:absolute;left:0;top:0;width:1px;height:40%;background:var(--fg);animation:sline 2s var(--ease-io) infinite}
@keyframes sline{from{transform:translateY(-100%)}to{transform:translateY(260%)}}
@media (max-width:760px){
  .hero-frames{grid-template-columns:1fr}
  .hf:not(:nth-child(2)){display:none}
  .hero.go .hf:nth-child(2){transition-delay:0s}
  .scroll-ind{top:auto;bottom:22px;right:50%;transform:translateX(50%);writing-mode:horizontal-tb;flex-direction:row}
  .scroll-ind i{width:36px;height:1px}
  .scroll-ind i::after{width:40%;height:1px;animation-name:slineh}
  .hero-copy{padding-bottom:72px}
  .hero-row .btn{width:100%}
}
@keyframes slineh{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

/* sections */
.sec{padding-block:clamp(72px,11vw,150px)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:clamp(28px,4vw,48px);flex-wrap:wrap}
.sec-head h2{font-size:clamp(36px,6.6vw,96px)}
.sec-head .side{display:grid;gap:10px;justify-items:end;text-align:right}
@media (max-width:640px){.sec-head .side{justify-items:start;text-align:left}}

/* product grid + cards */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:clamp(10px,1.4vw,20px);row-gap:clamp(34px,4vw,56px)}
@media (max-width:1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10px;row-gap:30px}}
.card{display:grid;gap:12px;min-width:0}
.media{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--surface)}
.sk::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%);background-size:200% 100%;animation:shim 1.4s linear infinite;z-index:0}
.sk.ld::before{display:none}
@keyframes shim{from{background-position:150% 0}to{background-position:-50% 0}}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s var(--ease),transform 1.1s var(--ease);opacity:0}
.media.ld img.i1{opacity:1}
.media .cover-link{position:absolute;inset:0;z-index:2}
.badge{position:absolute;top:12px;left:12px;z-index:3;font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:rgba(11,11,10,.7);padding:4px 8px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.qa{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;background:rgba(11,11,10,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:12px;display:grid;gap:10px;transform:translateY(calc(100% + 14px));transition:transform .5s var(--ease)}
.qa .lbl{display:flex;justify-content:space-between;font-size:10px}
.qa-sizes{display:flex;flex-wrap:wrap;gap:4px}
.qa-sizes button{flex:1 0 auto;min-width:38px;height:32px;border:1px solid var(--line2);font-family:var(--f-mono);font-size:11px;transition:background .2s,color .2s,border-color .2s}
.qa-sizes button:hover{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.qa-m{display:none;position:absolute;right:8px;bottom:8px;z-index:3;width:36px;height:36px;border-radius:50%;background:rgba(11,11,10,.75);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);place-items:center;border:1px solid var(--line2)}
.qa-m svg{width:14px;height:14px}
@media (hover:hover) and (pointer:fine){
  .card:hover .media.ld img.i1{transform:scale(1.035)}
  .card:hover .media.ld.has2 img.i2{opacity:1;transform:scale(1.035)}
  .card:hover .media.ld.has2 img.i1{opacity:0}
  .card:hover .qa,.qa:focus-within{transform:none}
}
@media (hover:none),(pointer:coarse){.qa{display:none}.qa-m{display:grid}}
.touch .qa{display:none}.touch .qa-m{display:grid}
.c-info{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.c-name{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1.35;min-width:0}
.c-price{font-family:var(--f-mono);font-size:12px;color:var(--fg)}
.c-meta{grid-column:1/-1;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;letter-spacing:.06em}
.dots{display:flex;gap:5px}
.dots button{width:12px;height:12px;border-radius:50%;border:1px solid var(--line2);position:relative}
.dots button.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--fg)}
@media (max-width:640px){.c-info{grid-template-columns:1fr}.c-name{font-size:11px}}

/* editorial */
.std{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(24px,5vw,80px);align-items:center}
.std-img{position:relative}
.std-img .a{aspect-ratio:1/1;overflow:hidden;background:var(--surface)}
.std-img .a img,.std-img .b img{width:100%;height:100%;object-fit:cover}
.std-img .b{position:absolute;right:-6%;bottom:-10%;width:34%;aspect-ratio:3/4;overflow:hidden;border:6px solid var(--bg);background:var(--surface)}
.std-copy{display:grid;gap:26px;justify-items:start}
.std-copy h2{font-size:clamp(38px,5.4vw,84px)}

<script src="products.js"></script>
<script>
(() => {
"use strict";
const CFG = window.OVERYES_CONFIG, PRODUCTS = window.OVERYES_PRODUCTS;
const BY_ID = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
const CATS = {tshirts:"T-Shirts", hoodies:"Hoodies", pants:"Pants", accessories:"Accessories"};
const APP_SIZES = ["XS","S","M","L","XL","XXL"];
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $("#app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => CFG.currency + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const isOne = p => p.sizes.length === 1;
const talle = s => s === "ONE SIZE" ? "Único" : s;
const ico = (id, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (navigator.maxTouchPoints > 0 || "ontouchstart" in window) document.documentElement.classList.add("touch");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const waURL = msg => `https://wa.me/${CFG.whatsapp}${msg ? "?text=" + encodeURIComponent(msg) : ""}`;
$$("[data-cfg]").forEach(el => el.textContent = CFG[el.dataset.cfg]);
const GENERIC_WA = "Hola OverYes 👋\n\nTengo una consulta.";
$$(".wa-link").forEach(a => a.href = waURL(GENERIC_WA));

/* ---------- CART ---------- */
const CART_KEY = "overyes_cart_v1";
let cart = store.get(CART_KEY, []).filter(l => BY_ID[l.id] && l.qty > 0);
const saveCart = () => store.set(CART_KEY, cart);
const lineKey = (id, color, size) => `${id}|${color}|${size}`;
const colorOf = (p, name) => p.colors.find(c => c.name === name) || p.colors[0];
const cartCount = () => cart.reduce((a, l) => a + l.qty, 0);
const cartTotal = () => cart.reduce((a, l) => a + BY_ID[l.id].price * l.qty, 0);
function addToCart(id, color, size, qty = 1, opts = {}) {
  const k = lineKey(id, color, size);
  const ex = cart.find(l => l.key === k);
  if (ex) ex.qty = Math.min(99, ex.qty + qty); else cart.push({key: k, id, color, size, qty});
  saveCart(); syncCart(true);
  const p = BY_ID[id];
  toast("ADDED TO CART", `${p.name} — ${color} / ${talle(size)}`, colorOf(p, color).images[0][0]);
  if (opts.open !== false) setTimeout(() => openPanel("cart"), 260);
}
function setQty(key, q) {
  const l = cart.find(x => x.key === key); if (!l) return;
  if (q <= 0) cart = cart.filter(x => x.key !== key); else l.qty = Math.min(99, q);
  saveCart(); syncCart();
}
function cartMsg(details) {
  let m = "Hola OverYes 👋\n\nQuiero realizar el siguiente pedido:\n\n";
  cart.forEach((l, i) => {
    const p = BY_ID[l.id];
    m += `${i + 1}. ${p.name}\nColor: ${l.color}\nTalle: ${talle(l.size)}\nCantidad: ${l.qty}\nPrecio: ${fmt(p.price)}${l.qty > 1 ? " c/u" : ""}\n\n`;
  });
  m += `TOTAL: ${fmt(cartTotal())}\n\n`;
  if (details) {
    const d = [];
    if (details.name) d.push(`Nombre: ${details.name}`);
    if (details.delivery === "pickup" || details.name || details.city || details.address) d.push(`Entrega: ${details.delivery === "pickup" ? "Retiro" : "Envío a domicilio"}`);
    if (details.delivery !== "pickup" && (details.city || details.address)) d.push(`Dirección: ${[details.address, details.city].filter(Boolean).join(", ")}`);
    if (d.length) m += d.join("\n") + "\n\n";
  }
  return m + "¿Me pueden confirmar disponibilidad?";
}
function buyNowMsg(p, color, size, qty) {
  let m = `Hola OverYes 👋\n\nQuiero comprar:\n\nProducto: ${p.name}\nColor: ${color}\nTalle: ${talle(size)}\nCantidad: ${qty}\nPrecio: ${fmt(p.price)}`;
  if (qty > 1) m += ` c/u\nTotal: ${fmt(p.price * qty)}`;
  return m + "\n\n¿Está disponible?";
}
/* orders sent to WhatsApp are kept on this device for the Account page */
const ORD_KEY = "overyes_orders_v1", ME_KEY = "overyes_me_v1";
function recordOrder() {
  if (!cart.length) return;
  const orders = store.get(ORD_KEY, []);
  const sig = cart.map(l => l.key + "x" + l.qty).join(",");
  if (orders[0] && orders[0].sig === sig && Date.now() - orders[0].t < 10 * 60e3) return;
  orders.unshift({t: Date.now(), sig, total: cartTotal(), items: cart.map(l => ({id: l.id, color: l.color, size: l.size, qty: l.qty, price: BY_ID[l.id].price, name: BY_ID[l.id].name}))});
  store.set(ORD_KEY, orders.slice(0, 20));
}
function syncCart(bump) {
  const n = cartCount();
  [$("#cc"), $("#dcc"), $("#mcc")].forEach(e => e.textContent = n);
  const b = $("#cb"); b.textContent = n || ""; b.dataset.n = n;
  if (bump) { const c = $("#cc"); c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
  renderDrawer();
  if (route.view === "cart") renderCartPage(true);
}
function lineHTML(l, big) {
  const p = BY_ID[l.id], c = colorOf(p, l.color), img = c.images[0][0];
  return `<div class="line" data-key="${esc(l.key)}">
    <a class="ph" href="#p-${p.id}"><img src="${img}" alt="${esc(p.name)}" loading="lazy"></a>
    <div class="bd2">
      <a class="nm" href="#p-${p.id}">${esc(p.name)}</a>
      <div class="vr">${esc(l.color)} / ${esc(talle(l.size))}</div>
      <div class="mono">${fmt(p.price)}</div>
      <div class="ctl">
        <div class="qty sm"><button data-act="dec" aria-label="Decrease quantity">${ico("minus")}</button><output>${l.qty}</output><button data-act="inc" aria-label="Increase quantity">${ico("plus")}</button></div>
        <button class="rm" data-act="remove">Remove</button>
      </div>
    </div>${big ? `<div class="tot">${fmt(p.price * l.qty)}</div>` : ""}
  </div>`;
}
function renderDrawer() {
  const body = $("#cartBody"), foot = $("#cartFoot");
  if (!cart.length) {
    body.innerHTML = `<div class="cart-empty"><p class="display" style="font-size:30px">Your cart is empty</p><p style="color:var(--muted)">Pick a size, add it here, and finish your order on WhatsApp.</p><a class="btn" href="#shop">Shop now</a></div>`;
    foot.hidden = true; return;
  }
  foot.hidden = false;
  body.innerHTML = cart.map(l => lineHTML(l)).join("");
  foot.innerHTML = `<div class="row-between"><span class="lbl">Total</span><span class="mono" style="font-size:16px">${fmt(cartTotal())}</span></div>
    <p style="margin:0;color:var(--muted);font-size:12px">Shipping is coordinated on WhatsApp.</p>
    <a class="btn ghost block" href="#cart">View cart</a>
    <a class="btn wa block" target="_blank" rel="noopener" data-act="checkout" href="${waURL(cartMsg(store.get(ME_KEY, null)))}">${ico("wa")}Checkout via WhatsApp</a>`;
}

/* ---------- PANELS ---------- */
let openId = null, lastFocus = null;
function openPanel(id) {
  closePanels(true);
  const el = {cart: $("#cartDr"), filter: $("#filterDr"), search: $("#search"), menu: $("#menu"), sheet: $("#sheet")}[id];
  lastFocus = document.activeElement;
  el.classList.add("on"); el.setAttribute("aria-hidden", "false");
  if (id !== "menu") $("#scrim").classList.add("on");
  document.documentElement.style.overflow = "hidden";
  openId = id;
  if (id === "menu") { $("#menuBtn").setAttribute("aria-expanded", "true"); $("#nav").classList.add("solid"); }
  if (id === "search") setTimeout(() => $("#sInput").focus(), 120);
  if (id === "cart") setTimeout(() => $(".dr-head button", el).focus({preventScroll: true}), 80);
}
function closePanels(silent) {
  ["#cartDr", "#filterDr", "#search", "#menu", "#sheet"].forEach(s => { const e = $(s); e.classList.remove("on"); e.setAttribute("aria-hidden", "true"); });
  $("#scrim").classList.remove("on");
  document.documentElement.style.overflow = "";
  $("#menuBtn").setAttribute("aria-expanded", "false");
  if (openId && !silent && lastFocus && lastFocus.focus) lastFocus.focus({preventScroll: true});
  openId = null; navState();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && openId) closePanels(); });

/* ---------- TOAST ---------- */
let toastT;
function toast(t1, t2, img) {
  const t = $("#toast");
  $(".t1", t).textContent = t1; $(".t2", t).textContent = t2 || "";
  t.classList.toggle("noimg", !img); if (img) $("img", t).src = img;
  t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2400);
}

/* ---------- SEARCH ---------- */
const hay = p => norm([p.name, CATS[p.cat], p.cat, p.sub, p.tags, p.colors.map(c => c.name).join(" "), p.cat === "tshirts" ? "tee tees shirt t-shirt" : "", p.cat === "hoodies" ? "hoodie hood" : "", p.cat === "pants" ? "pants pant trousers cargo" : ""].join(" ")).split(/[^a-z0-9]+/).filter(Boolean);
const HAY = Object.fromEntries(PRODUCTS.map(p => [p.id, hay(p)]));
function matches(p, q) {
  const toks = norm(q).split(/[^a-z0-9]+/).filter(Boolean);
  if (!toks.length) return true;
  const words = HAY[p.id];
  return toks.every(t => words.some(w => w.startsWith(t) || (w.length >= 3 && t.startsWith(w) && t.length - w.length <= 2)));
}
const SUGG = ["Hoodie", "Cargo", "Tee", "Cap", "Angel", "Flame", "Backpack", "Sunglasses"];
$("#sSugg").innerHTML = SUGG.map(s => `<button class="chip" data-act="sugg" data-q="${s}">${s}</button>`).join("");
function renderSearch() {
  const q = $("#sInput").value.trim(), out = $("#sOut");
  if (!q) { out.innerHTML = ""; return; }
  const res = PRODUCTS.filter(p => matches(p, q));
  if (!res.length) { out.innerHTML = `<div class="s-meta"><span class="eyebrow">No results for “${esc(q)}”</span><a class="link-u lbl" href="#shop">Browse all</a></div>`; return; }
  out.innerHTML = `<div class="s-res">${res.slice(0, 6).map(p => `<a href="#p-${p.id}"><div class="ph"><img src="${p.colors[0].images[0][0]}" alt="" loading="lazy"></div><div class="nm">${esc(p.name)}</div><div class="mono">${fmt(p.price)}</div></a>`).join("")}</div>
    <div class="s-meta"><span class="eyebrow">${res.length} result${res.length > 1 ? "s" : ""}</span><button class="btn" data-act="search-all">View all results</button></div>`;
}
$("#sInput").addEventListener("input", renderSearch);
$("#sInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); searchAll(); } });
function searchAll() { shop.q = $("#sInput").value.trim(); shop.cats.clear(); shop.sub = ""; shop.newOnly = false; closePanels(true); go("shop", true); }

/* ---------- CARDS ---------- */
function cardHTML(p, i = 0) {
  const c = p.colors[0], im = c.images, has2 = im.length > 1;
  const sizes = p.sizes.map(s => `<button data-act="qa-size" data-size="${s}">${isOne(p) ? "Add" : s}</button>`).join("");
  return `<article class="card" data-id="${p.id}" data-color="${esc(c.name)}" data-rv style="--d:${(i % 4) * 0.07}s">
    <div class="media sk ${has2 ? "has2" : ""}" data-cursor="view">
      <img class="i1" src="${im[0][0]}" alt="${esc(p.name)} — ${esc(c.name)}" loading="lazy" decoding="async" width="${im[0][1]}" height="${im[0][2]}">
      ${has2 ? `<img class="i2" src="${im[1][0]}" alt="" loading="lazy" decoding="async">` : ""}
      <a class="cover-link" href="#p-${p.id}" aria-label="${esc(p.name)}"></a>
      ${p.new ? `<span class="badge">New</span>` : ""}
      <div class="qa"><div class="lbl"><span>Quick add</span><span>${isOne(p) ? "One size" : "Select size"}</span></div><div class="qa-sizes">${sizes}</div></div>
      <button class="qa-m" data-act="qa-open" aria-label="Quick add ${esc(p.name)}">${ico("plus")}</button>
    </div>
    <div class="c-info">
      <a class="c-name" href="#p-${p.id}">${esc(p.name)}</a><span class="c-price">${fmt(p.price)}</span>
      ${p.colors.length > 1 ? `<div class="c-meta"><div class="dots">${p.colors.map((cc, k) => `<button class="${k ? "" : "on"}" style="background:${cc.hex}" data-act="card-color" data-color="${esc(cc.name)}" aria-label="${esc(cc.name)}" title="${esc(cc.name)}"></button>`).join("")}</div><span>${p.colors.length} colours</span></div>` : ""}
    </div>
  </article>`;
}
function setCardColor(card, name) {
  const p = BY_ID[card.dataset.id], c = colorOf(p, name), m = $(".media", card);
  card.dataset.color = c.name;
  $$(".dots button", card).forEach(b => b.classList.toggle("on", b.dataset.color === c.name));
  const i1 = $(".i1", m), i2 = $(".i2", m);
  i1.src = c.images[0][0]; i1.alt = `${p.name} — ${c.name}`;
  if (i2) { if (c.images[1]) { i2.src = c.images[1][0]; m.classList.add("has2"); } else m.classList.remove("has2"); }
}
function wireImages(root = document) {
  $$(".media.sk:not(.ld) img.i1, .gal figure:not(.ld) img", root).forEach(img => {
    const box = img.closest(".media, figure");
    const done = () => box.classList.add("ld");
    if (img.complete && img.naturalWidth) done(); else { img.addEventListener("load", done, {once: true}); img.addEventListener("error", done, {once: true}); }
  });
}

/* ---------- QUICK ADD SHEET (touch) ---------- */
let sheetState = null;
function openSheet(id, color) {
  const p = BY_ID[id];
  sheetState = {id, color: color || p.colors[0].name, size: isOne(p) ? p.sizes[0] : null};
  renderSheet(); openPanel("sheet");
}
function renderSheet() {
  const s = sheetState, p = BY_ID[s.id], c = colorOf(p, s.color);
  $("#sheet").innerHTML = `<div class="sh-top"><img src="${c.images[0][0]}" alt=""><div><div class="c-name">${esc(p.name)}</div><div class="mono">${fmt(p.price)}</div></div><button class="icon-btn" data-act="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    ${p.colors.length > 1 ? `<div class="opt"><div class="lbl">Color <b style="color:var(--muted)">${esc(c.name)}</b></div><div class="swatches">${p.colors.map(cc => `<button class="${cc.name === c.name ? "on" : ""}" data-act="sh-color" data-color="${esc(cc.name)}"><i style="background:${cc.hex}"></i>${esc(cc.name)}</button>`).join("")}</div></div>` : ""}
    <div class="opt"><div class="lbl">${isOne(p) ? "Size" : "Select your size"}</div><div class="sizes ${isOne(p) ? "one" : p.sizes.length === 4 ? "four" : ""}" id="shSizes">${p.sizes.map(z => `<button class="${s.size === z ? "on" : ""}" data-act="sh-size" data-size="${z}">${z}</button>`).join("")}</div><div class="err-msg" id="shErr"></div></div>
    <button class="btn block" data-act="sh-add">Add to cart — ${fmt(p.price)}</button>`;
}

/* ---------- ROUTER ---------- */
const route = {view: "home", token: "home"};
const shop = {cats: new Set(), sizes: new Set(), colors: new Set(), prices: new Set(), sub: "", q: "", sort: "featured", newOnly: false};
const PRICE_BANDS = [["u1000", "Under $1.000", p => p.price < 1000], ["1000", "$1.000 – $1.999", p => p.price >= 1000 && p.price < 2000], ["2000", "$2.000 – $2.999", p => p.price >= 2000 && p.price < 3000], ["3000", "$3.000 +", p => p.price >= 3000]];
let pdpPreset = null;
function parse(t) {
  t = (t || "").replace(/^#/, "") || "home";

    ${related.length ? `<section class="sec" style="padding-bottom:0"><div class="sec-head"><h2 class="display" style="font-size:clamp(30px,4.4vw,64px)" data-rv>You may<br>also like</h2><a class="link-u lbl" href="#${p.cat}" data-rv>All ${CATS[p.cat]}</a></div><div class="grid">${related.map(cardHTML).join("")}</div></section>` : ""}
  </div>`;
  renderGallery(); updateBuyWa();
  $("#gal").addEventListener("scroll", galCount, {passive: true});
}
function renderGallery() {
  const p = BY_ID[pdp.id], imgs = colorOf(p, pdp.color).images;
  const small = imgs.filter(i => i[1] < 800).length;
  let smallSeen = 0;
  $("#gal").innerHTML = imgs.map((im, i) => {
    const wide = im[1] >= 800; if (!wide) smallSeen++;
    const loneLast = !wide && smallSeen === small && small % 2 === 1;
    return `<figure class="${wide ? "wide" : ""}${loneLast ? " wide fit" : ""}" data-cursor="view"><img src="${im[0]}" alt="${esc(p.name)} — ${esc(pdp.color)}, image ${i + 1}" width="${im[1]}" height="${im[2]}" ${i ? 'loading="lazy"' : 'fetchpriority="high"'} decoding="async"></figure>`;
  }).join("");
  wireImages($("#gal")); $("#gal").scrollLeft = 0; galCount();
}
function galCount() { const g = $("#gal"); if (!g) return; const n = g.children.length; const i = Math.round(g.scrollLeft / (g.clientWidth || 1)) + 1; $("#galN").textContent = `${Math.min(i, n)} / ${n}`; }
function updateBuyWa() {
  const a = $("#buyWa"); if (!a) return; const p = BY_ID[pdp.id];
  a.href = pdp.size ? waURL(buyNowMsg(p, pdp.color, pdp.size, pdp.qty)) : "#";
}
function needSize(errId, sizesId) {
  const e = $("#" + errId), s = $("#" + sizesId);
  e.textContent = "PLEASE SELECT A SIZE";
  s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake", "err");
  $("#sizeLbl") && errId === "sizeErr" && s.scrollIntoView({block: "center", behavior: reduce ? "auto" : "smooth"});
}
function sizeGuide(p) {
  const rows = {
    tshirts: [["Chest", 56, 58, 61, 64, 67, 70], ["Length", 68, 70, 72, 74, 76, 78], ["Sleeve", 22, 23, 24, 25, 26, 27]],
    hoodies: [["Chest", 60, 63, 66, 69, 72, 75], ["Length", 66, 68, 70, 72, 74, 76], ["Sleeve", 58, 60, 62, 64, 66, 68]],
    pants: [["Waist (relaxed)", 70, 74, 78, 82, 86, 90], ["Hip", 108, 112, 116, 120, 124, 128], ["Inseam", 76, 77, 78, 79, 80, 81]]
  }[p.cat];
  if (!rows) return "";
  return `<p style="margin:0">Garment measurements in cm, laid flat. Oversized fit by design — size down for a closer fit.</p><div class="tbl"><table><thead><tr><th></th>${APP_SIZES.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => i ? `<td>${c}</td>` : `<th>${c}</th>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const SHIP_HTML = `<p style="margin:0">We ship to all of Uruguay. Montevideo by courier, the rest of the country through a shipping agency. Cost and delivery time are confirmed with you on WhatsApp before you pay.</p><p style="margin:0">Prefer to pick up? Choose “Pick up” at checkout and we’ll agree a point.</p>`;
const RET_HTML = `<p style="margin:0">Wrong size? Write to us on WhatsApp within 7 days of receiving your order. Items must be unworn, unwashed and with tags. Size exchanges depend on stock.</p>`;

/* ---------- CART PAGE ---------- */
let sentNotice = false;
function renderCartPage(soft) {
  const me = store.get(ME_KEY, {}) || {};
  if (!cart.length) {
    app.innerHTML = `<div class="page wrap"><header class="shop-head"><span class="eyebrow">Cart</span><h1 class="display">Your cart</h1></header>
      <div class="cart-empty" style="padding-block:60px 20px"><p style="color:var(--muted);font-size:16px">Your cart is empty.</p>${sentNotice ? sentHTML() : ""}<a class="btn" href="#shop">Continue shopping</a></div></div>`;
    return;
  }
  const keepScroll = soft ? scrollY : 0;
  app.innerHTML = `<div class="page wrap"><header class="shop-head" style="margin-bottom:clamp(20px,3vw,40px)"><span class="eyebrow">Cart — ${cartCount()} item${cartCount() > 1 ? "s" : ""}</span><h1 class="display">Your cart</h1></header>
    <div class="cart-page">
      <div><div style="border-top:1px solid var(--line)">${cart.map(l => lineHTML(l, true)).join("")}</div>
        <div style="margin-top:22px"><a class="link-u lbl" href="#shop">← Continue shopping</a></div></div>
      <aside class="summary">
        <span class="lbl">Order summary</span>
        <div class="rowb"><span style="color:var(--muted)">Subtotal</span><span class="mono">${fmt(cartTotal())}</span></div>
        <div class="rowb"><span style="color:var(--muted)">Shipping</span><span class="mono" style="color:var(--muted)">Coordinated on WhatsApp</span></div>
        <div class="rowb total"><span class="lbl" style="font-size:12px">Total</span><span class="mono" style="font-size:20px">${fmt(cartTotal())}</span></div>
        <div style="display:grid;gap:12px;border-top:1px solid var(--line);padding-top:16px">
          <span class="lbl">Your details <span style="color:var(--muted);font-weight:500">— optional</span></span>
          <div class="field"><label for="ckName">Name</label><input id="ckName" value="${esc(me.name || "")}" autocomplete="name"></div>
          <div class="seg" role="group" aria-label="Delivery"><button data-act="dlv" data-v="ship" class="${me.delivery !== "pickup" ? "on" : ""}">Shipping</button><button data-act="dlv" data-v="pickup" class="${me.delivery === "pickup" ? "on" : ""}">Pick up</button></div>
          <div class="fields" id="addrF" ${me.delivery === "pickup" ? "hidden" : ""}><div class="field"><label for="ckCity">City / Department</label><input id="ckCity" value="${esc(me.city || "")}" autocomplete="address-level1"></div><div class="field"><label for="ckAddr">Address</label><input id="ckAddr" value="${esc(me.address || "")}" autocomplete="street-address"></div></div>
        </div>
        <a class="btn wa block" id="ckBtn" target="_blank" rel="noopener" data-act="checkout" href="#">${ico("wa")}Finalizar pedido</a>
        <p style="margin:0;color:var(--muted);font-size:12px">Opens WhatsApp with your full order written out — products, colours, sizes, quantities and total. Send it and we confirm availability.</p>
        ${sentNotice ? sentHTML() : ""}
      </aside>
    </div></div>`;
  ["ckName", "ckCity", "ckAddr"].forEach(id => $("#" + id).addEventListener("input", saveCk));
  updateCk();
  if (soft) window.scrollTo(0, keepScroll);
}
function ckDetails() {
  const dl = $(".seg .on") ? $(".seg .on").dataset.v : "ship";
  return {name: ($("#ckName") || {}).value?.trim() || "", city: ($("#ckCity") || {}).value?.trim() || "", address: ($("#ckAddr") || {}).value?.trim() || "", delivery: dl};
}
function saveCk() { const d = ckDetails(); store.set(ME_KEY, {...(store.get(ME_KEY, {}) || {}), ...d}); updateCk(); renderDrawer(); }
function updateCk() { const b = $("#ckBtn"); if (b) b.href = waURL(cartMsg(ckDetails())); }
function sentHTML() {
  return `<div class="notice" id="sent"><span><b>Your order is ready in WhatsApp.</b> If it didn't open, message us at <span class="sel-text">${CFG.whatsappIntl}</span>.</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" style="--h:38px;padding:0 14px;font-size:10px" data-act="copy-order">Copy order text</button>${cart.length ? `<button class="btn ghost" style="--h:38px;padding:0 14px;font-size:10px" data-act="empty-cart">Empty cart</button>` : ""}</div></div>`;
}

/* ---------- ACCOUNT ---------- */
const DEPTS = ["Montevideo", "Canelones", "Maldonado", "Colonia", "San José", "Florida", "Lavalleja", "Rocha", "Salto", "Paysandú", "Río Negro", "Soriano", "Flores", "Durazno", "Tacuarembó", "Rivera", "Artigas", "Cerro Largo", "Treinta y Tres"];
function renderAccount() {
  const me = store.get(ME_KEY, {}) || {}, orders = store.get(ORD_KEY, []);
  app.innerHTML = `<div class="page wrap"><header class="shop-head" style="margin-bottom:clamp(24px,4vw,48px)"><span class="eyebrow">Account</span><h1 class="display">Account</h1><p style="color:var(--muted);max-width:52ch;margin:0">No password needed. Your details and order history stay on this device and fill in your WhatsApp orders for you.</p></header>
  <div class="two">
    <form class="panel" id="meForm" novalidate>
      <span class="lbl">My details</span>
      <div class="fields">
        <div class="field full"><label for="meName">Full name</label><input id="meName" value="${esc(me.name || "")}" autocomplete="name"></div>
        <div class="field"><label for="mePhone">Phone</label><input id="mePhone" value="${esc(me.phone || "")}" inputmode="tel" autocomplete="tel"></div>
        <div class="field"><label for="meCity">Department</label><select id="meCity"><option value="">—</option>${DEPTS.map(d => `<option ${me.city === d ? "selected" : ""}>${d}</option>`).join("")}</select></div>
        <div class="field full"><label for="meAddr">Address</label><input id="meAddr" value="${esc(me.address || "")}" autocomplete="street-address"></div>
      </div>
      <button class="btn" type="submit">Save details</button>
    </form>
    <div class="panel"><span class="lbl">Order history</span>
      ${orders.length ? orders.map((o, i) => `<div class="order"><div class="row-between"><span class="mono">${new Date(o.t).toLocaleDateString("es-UY", {day: "2-digit", month: "short", year: "numeric"})}</span><span class="mono">${fmt(o.total)}</span></div>
        <ul>${o.items.map(it => `<li>${esc(it.name)} — ${esc(it.color)} / ${esc(talle(it.size))} × ${it.qty}</li>`).join("")}</ul>
        <div class="acts"><button class="btn ghost" data-act="reorder" data-i="${i}">Reorder</button><a class="btn wa" target="_blank" rel="noopener" href="${waURL(`Hola OverYes 👋\n\nConsulto por mi pedido del ${new Date(o.t).toLocaleDateString("es-UY")}:\n\n${o.items.map(it => `• ${it.name} — ${it.color} / ${talle(it.size)} × ${it.qty}`).join("\n")}\n\nTOTAL: ${fmt(o.total)}`)}">${ico("wa")}Ask about it</a></div></div>`).join("")
      : `<p style="color:var(--muted);margin:0">No orders yet. Orders you send through WhatsApp checkout appear here.</p><a class="btn ghost" href="#shop" style="justify-self:start">Start shopping</a>`}
    </div>
  </div></div>`;
  $("#meForm").addEventListener("submit", e => {
    e.preventDefault();
    store.set(ME_KEY, {...me, name: $("#meName").value.trim(), phone: $("#mePhone").value.trim(), city: $("#meCity").value, address: $("#meAddr").value.trim()});
    renderDrawer(); toast("DETAILS SAVED", "Used to fill in your WhatsApp orders");
  });
}

/* ---------- INFO ---------- */
function renderInfo() {
  const sgAll = ["tshirts", "hoodies", "pants"].map(c => `<p style="margin:12px 0 0"><b>${CATS[c]}</b></p>` + sizeGuide({cat: c}).replace(/^<p[^>]*>.*?<\/p>/, "")).join("");
  app.innerHTML = `<div class="page wrap"><header class="shop-head" style="margin-bottom:clamp(24px,4vw,48px)"><span class="eyebrow">Support</span><h1 class="display">Help</h1></header>
    <section class="info-sec" id="s-contact"><h2 class="display">Contact</h2><div class="ac-b"><p style="margin:0">Questions, sizing or order status — talk to us directly.</p><p style="margin:0">WhatsApp: <span class="sel-text">${CFG.whatsappIntl}</span></p><a class="btn wa wa-link" style="justify-self:start" target="_blank" rel="noopener" href="${waURL(GENERIC_WA)}">${ico("wa")}Chat on WhatsApp</a><p style="margin:0"><a class="link-u" href="${CFG.instagram}" target="_blank" rel="noopener">Instagram</a> &nbsp;·&nbsp; <a class="link-u" href="${CFG.tiktok}" target="_blank" rel="noopener">TikTok</a></p></div></section>
    <section class="info-sec" id="s-shipping"><h2 class="display">Shipping</h2><div class="ac-b">${SHIP_HTML}</div></section>
    <section class="info-sec" id="s-returns"><h2 class="display">Returns</h2><div class="ac-b">${RET_HTML}</div></section>
    <section class="info-sec" id="s-size-guide"><h2 class="display">Size guide</h2><div class="ac-b"><p style="margin:0">Garment measurements in cm, laid flat. Everything is cut oversized — size down for a closer fit.</p>${sgAll}</div></section>
  </div>`;
}

/* ---------- FOOTER ---------- */
$("#footer").innerHTML = `<div class="f-grid">
  <div class="f-brand"><a href="#home" class="logo"><svg class="star" viewBox="0 0 24 24"><use href="#i-star"/></svg>OverYes</a><span class="eyebrow">Streetwear — Est. 2024</span><p class="serif" style="font-size:22px;margin:6px 0 0;color:var(--muted)">Lost thoughts. Bigger plans.</p></div>
  <div><h4>SHOP</h4><ul><li><a class="link-u" href="#shop">Shop</a></li><li><a class="link-u" href="#new">New Arrivals</a></li><li><a class="link-u" href="#clothing">Clothing</a></li><li><a class="link-u" href="#pants">Pants</a></li><li><a class="link-u" href="#accessories">Accessories</a></li></ul></div>
  <div><h4>SUPPORT</h4><ul><li><a class="link-u" href="#contact">Contact</a></li><li><a class="link-u" href="#shipping">Shipping</a></li><li><a class="link-u" href="#returns">Returns</a></li><li><a class="link-u" href="#size-guide">Size Guide</a></li></ul></div>
  <div><h4>SOCIAL</h4><ul><li><a class="link-u" href="${CFG.instagram}" target="_blank" rel="noopener">Instagram</a></li><li><a class="link-u" href="${CFG.tiktok}" target="_blank" rel="noopener">TikTok</a></li></ul></div>
  <div><h4>WHATSAPP</h4><ul><li><a class="link-u wa-link mono" style="font-size:13px" href="${waURL(GENERIC_WA)}" target="_blank" rel="noopener">${CFG.whatsappDisplay.replace(/\s/g, "")}</a></li></ul></div>
</div>
<div class="f-word fit" aria-hidden="true">OVERYES</div>
<div class="f-bottom mono"><span>© ${new Date().getFullYear()} OverYes. All rights reserved.</span><span>Montevideo — Uruguay</span></div>`;

/* ---------- EVENTS ---------- */
document.addEventListener("click", e => {
  const a = e.target.closest("a[href^='#']");
  const act = e.target.closest("[data-act]");
  if (act) {
    const k = act.dataset.act;
    const card = act.closest(".card"), line = act.closest(".line");
    switch (k) {
      case "search": e.preventDefault(); openPanel("search"); renderSearch(); return;
      case "cart": e.preventDefault(); openPanel("cart"); return;
      case "menu": e.preventDefault(); openId === "menu" ? closePanels() : openPanel("menu"); return;
      case "close": e.preventDefault(); closePanels(); return;
      case "filters": openPanel("filter"); return;
      case "sugg": $("#sInput").value = act.dataset.q; renderSearch(); $("#sInput").focus(); return;
      case "search-all": searchAll(); return;
      case "scroll-next": $("#new-arrivals").scrollIntoView({behavior: reduce ? "auto" : "smooth"}); return;
      case "rail": { const r = $("#rail"); r.scrollBy({left: act.dataset.dir * r.clientWidth * 0.8, behavior: reduce ? "auto" : "smooth"}); return; }
      case "card-color": setCardColor(card, act.dataset.color); return;
      case "qa-size": addToCart(card.dataset.id, card.dataset.color, act.dataset.size, 1); return;
      case "qa-open": openSheet(card.dataset.id, card.dataset.color); return;
      case "sh-color": sheetState.color = act.dataset.color; renderSheet(); return;
      case "sh-size": sheetState.size = act.dataset.size; renderSheet(); return;
      case "sh-add": if (!sheetState.size) { needSize("shErr", "shSizes"); return; } closePanels(true); addToCart(sheetState.id, sheetState.color, sheetState.size, 1); return;
      case "inc": case "dec": { const key = line.dataset.key, l = cart.find(x => x.key === key); setQty(key, l.qty + (k === "inc" ? 1 : -1)); return; }
      case "remove": { const key = line.dataset.key; line.classList.add("out"); setTimeout(() => setQty(key, 0), 300); return; }
      case "checkout": {
        if (!cart.length) { e.preventDefault(); return; }
        if (route.view === "cart") { act.href = waURL(cartMsg(ckDetails())); }
        recordOrder(); sentNotice = true;
        if (route.view === "cart") setTimeout(() => renderCartPage(true), 400);
        return; // default: follow the wa.me link in a new tab
      }
      case "copy-order": {
        const txt = cartMsg(ckDetails());
        const done = () => toast("COPIED", "Paste it in WhatsApp");
        try { navigator.clipboard.writeText(txt).then(done, () => toast("COPY NOT ALLOWED", "Select the number and message us")); } catch (err) { toast("COPY NOT ALLOWED", "Select the number and message us"); }
        return;
      }
      case "empty-cart": cart = []; saveCart(); sentNotice = false; syncCart(); toast("CART EMPTIED", ""); return;
      case "dlv": $$(".seg button").forEach(b => b.classList.toggle("on", b === act)); $("#addrF").hidden = act.dataset.v === "pickup"; saveCk(); return;
      case "f": toggleFilter(act.dataset.k, act.dataset.v); return;
      case "unf": toggleFilter(act.dataset.k, act.dataset.v); return;
      case "clear-filters": shop.sizes.clear(); shop.colors.clear(); shop.prices.clear(); if (shop.cats.size > 1) shop.cats.clear(); renderFilters(); syncShopChrome(); renderResults(); return;
      case "reset-shop": shop.sizes.clear(); shop.colors.clear(); shop.prices.clear(); shop.cats.clear(); shop.q = ""; shop.sub = ""; shop.newOnly = false; go("shop", true); return;
      case "clear-q": e.preventDefault(); shop.q = ""; $("#shopQ").value = ""; act.hidden = true; syncShopChrome(); renderResults(); return;
      case "sub": shop.sub = act.dataset.sub; renderResults(); return;
      case "preset-color": pdpPreset = act.dataset.color; break; // falls through to link navigation
      case "pdp-color": {
        pdp.color = act.dataset.color;
        $$("#pdpColors button").forEach(b => { b.classList.toggle("on", b === act); b.setAttribute("aria-pressed", b === act); });
        $("#colN").textContent = pdp.color; renderGallery(); updateBuyWa(); return;
      }
      case "pdp-size": {
        pdp.size = act.dataset.size;
        $$("#pdpSizes button").forEach(b => { b.classList.toggle("on", b === act); b.setAttribute("aria-pressed", b === act); });
        $("#pdpSizes").classList.remove("err"); $("#sizeErr").textContent = ""; $("#sizeLbl").textContent = "Size — " + pdp.size; updateBuyWa(); return;
      }
      case "pdp-inc": case "pdp-dec": pdp.qty = Math.max(1, Math.min(99, pdp.qty + (k === "pdp-inc" ? 1 : -1))); $("#pdpQty output").textContent = pdp.qty; updateBuyWa(); return;
      case "pdp-add": {
        if (!pdp.size) { needSize("sizeErr", "pdpSizes"); return; }
        addToCart(pdp.id, pdp.color, pdp.size, pdp.qty);
        act.textContent = "Added ✓"; setTimeout(() => { if (act.isConnected) act.textContent = "Add to cart"; }, 1400);
        return;
      }
      case "buy-wa": if (!pdp.size) { e.preventDefault(); needSize("sizeErr", "pdpSizes"); } return;
      case "open-sg": { const d = $("#sgAcc"); d.open = true; d.scrollIntoView({block: "center", behavior: reduce ? "auto" : "smooth"}); return; }
      case "reorder": { const o = store.get(ORD_KEY, [])[+act.dataset.i]; o.items.forEach(it => { if (BY_ID[it.id]) { const kk = lineKey(it.id, it.color, it.size); const ex = cart.find(l => l.key === kk); if (ex) ex.qty += it.qty; else cart.push({key: kk, id: it.id, color: it.color, size: it.size, qty: it.qty}); } }); saveCart(); syncCart(true); openPanel("cart"); return; }
    }
  }
  if (a && !a.target) {
    const t = a.getAttribute("href").slice(1);
    if (!t) { e.preventDefault(); return; }
    e.preventDefault(); go(t);
  }
});

/* ---------- CURSOR ---------- */
if (matchMedia("(hover:hover) and (pointer:fine)").matches && !reduce) {
  const c = $("#cursor"); let x = -100, y = -100, cx = -100, cy = -100;
  addEventListener("pointermove", e => { if (e.pointerType !== "mouse") return; x = e.clientX; y = e.clientY; c.classList.add("on");
    const t = e.target; c.classList.toggle("view", !!t.closest("[data-cursor=view]") && !t.closest("button,.qa"));
    c.classList.toggle("hov", !!t.closest("a,button,select,summary,label") && !c.classList.contains("view")); }, {passive: true});
  document.addEventListener("pointerleave", () => c.classList.remove("on"));
  (function loop() { cx += (x - cx) * 0.2; cy += (y - cy) * 0.2; c.style.transform = `translate3d(${cx}px,${cy}px,0)`; requestAnimationFrame(loop); })();
}

/* ---------- BOOT ---------- */
let loaderDone = false;
const startHero = () => { loaderDone = true; const h = $("#hero"); if (h) h.classList.add("go"); };
syncCart();
render(parse(location.hash));
const L = $("#loader");
let seen = false; try { seen = sessionStorage.getItem("oy_seen") === "1"; sessionStorage.setItem("oy_seen", "1"); } catch (e) {}
if (seen || reduce) { L.remove(); startHero(); }
else {
  $(".lw", L).innerHTML = "OVERYES".split("").map((ch, i) => `<span style="animation-delay:${i * 0.045}s">${ch}</span>`).join("");
  setTimeout(() => { L.classList.add("out"); setTimeout(startHero, 250); setTimeout(() => L.remove(), 900); }, 950);
}
})();
</script>
</body>
</html>
